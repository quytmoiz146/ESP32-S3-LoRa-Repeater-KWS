; ==============================================================================
; PROJECT: ESP32-S3 LoRa Mesh & KWS Node
; ==============================================================================

[platformio]
default_envs = repeater_full

; ------------------------------------------------------------------------------
; Môi trường dùng chung (Base Environment)
; ------------------------------------------------------------------------------
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi

; Các cờ biên dịch dùng chung (PSRAM, RadioLib, Tối ưu hóa -O2)
build_flags = 
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_SUPPORT=1
	-D RADIOLIB_LOW_LEVEL=1
	-O2

lib_deps =
	jgromes/RadioLib@^6.6.0


; ==============================================================================
; ĐỊNH NGHĨA CÁC CHẾ ĐỘ NẠP & XUẤT SERIAL CHO ESP32-S3:
; - USB_CDC: Cắm vào cổng Type-C "USB" Native (chân D+/D- nối thẳng chip ESP32-S3).
; - USB_TTL: Cắm vào cổng Type-C "UART" (hoặc qua chip CH340 / CP2102 / nạp ngoài).
; ==============================================================================
[usb_cdc]
build_unflags =
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[usb_ttl]
build_unflags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0


; ==============================================================================
; Môi trường 1: REPEATER ĐẦY ĐỦ CHỨC NĂNG (KWS, I2S, LoRa...)
; ==============================================================================
[env:repeater_full]
; --- Cấu hình cổng COM & Tốc độ nạp ---
upload_port = COM17      ; Cổng COM nạp cho Repeater Full
monitor_port = COM17     ; Cổng COM mở Serial Monitor cho Repeater Full
upload_speed = 921600   ; Tốc độ nạp (921600 hoặc 460800 nếu chập chờn)

; [Lựa chọn 1] Chế độ USB_CDC (Cổng Type-C "USB" Native)
; build_unflags = ${usb_cdc.build_unflags}
; build_flags = ${env.build_flags} ${usb_cdc.build_flags}

; [Lựa chọn 2] Chế độ USB_TTL (Cổng Type-C "UART" / Chip ngoài CH340, CP2102)
build_unflags = ${usb_ttl.build_unflags}
build_flags = 
	${env.build_flags} 
	${usb_ttl.build_flags}
	-D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1

lib_deps =
	${env.lib_deps}
	KWS
build_src_filter =
	+<*>
	-<main_repeater_simple.cpp>
	-<main_gateway.cpp>
	-<main_node.cpp>
	-<ble/>


; ==============================================================================
; Môi trường 2: REPEATER ĐƠN GIẢN / TỐI GIẢN (CHỈ CÓ LORA RELAY)
; ==============================================================================
[env:repeater_simple]
; --- Cấu hình cổng COM & Tốc độ nạp ---
upload_port = COM6      ; Cổng COM nạp cho Repeater Simple
monitor_port = COM6     ; Cổng COM mở Serial Monitor cho Repeater Simple
upload_speed = 921600   ; Tốc độ nạp (921600 hoặc 460800 nếu chập chờn)

; [Lựa chọn 1] Chế độ USB_CDC (Cổng Type-C "USB" Native)
; build_unflags = ${usb_cdc.build_unflags}
; build_flags = ${env.build_flags} ${usb_cdc.build_flags}

; [Lựa chọn 2] Chế độ USB_TTL (Cổng Type-C "UART" / Chip ngoài CH340, CP2102)
build_unflags = ${usb_ttl.build_unflags}
build_flags = 
	${env.build_flags} 
	${usb_ttl.build_flags}

build_src_filter =
	+<main_repeater_simple.cpp>
	+<lora_mesh/>
	-<main_repeater_full.cpp>
	-<main_gateway.cpp>
	-<main_node.cpp>
	-<capture/>
	-<keyword_spot/>
	-<stereo_process/>
	-<tier0/>
	-<ringbuffer/>
	-<ble/>


; ==============================================================================
; Môi trường 3: GATEWAY CHỈ HUY (LoRa Mesh + USB Serial NDJSON PC)
; ==============================================================================
[env:gateway]
upload_port = COM12
monitor_port = COM12
upload_speed = 921600
build_unflags = ${usb_ttl.build_unflags}
build_flags = 
	${env.build_flags} 
	${usb_ttl.build_flags}
	-D ROLE_GATEWAY

lib_deps =
	${env.lib_deps}
	bblanchon/ArduinoJson @ ^6.21.3

build_src_filter =
	+<main_gateway.cpp>
	+<lora_mesh/>
	-<main_repeater_full.cpp>
	-<main_repeater_simple.cpp>
	-<main_node.cpp>
	-<capture/>
	-<keyword_spot/>
	-<stereo_process/>
	-<tier0/>
	-<ringbuffer/>
	-<ble/>


; ==============================================================================
; Môi trường 4: NODE CẦM TAY / BALO (LoRa Mesh + BLE Nordic UART Mobile App)
; ==============================================================================
[env:node_ble]
upload_port = COM15
monitor_port = COM15
upload_speed = 921600
build_unflags = ${usb_ttl.build_unflags}
build_flags = 
	${env.build_flags} 
	${usb_ttl.build_flags}
	-D ROLE_NODE

lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino @ ^1.4.1
	bblanchon/ArduinoJson @ ^6.21.3

build_src_filter =
	+<main_node.cpp>
	+<lora_mesh/>
	+<ble/>
	-<main_repeater_full.cpp>
	-<main_repeater_simple.cpp>
	-<main_gateway.cpp>
	-<capture/>
	-<keyword_spot/>
	-<stereo_process/>
	-<tier0/>
	-<ringbuffer/>
